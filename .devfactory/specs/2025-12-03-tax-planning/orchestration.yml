  - "federal-tax-calculator"
  - "wisconsin-tax-calculator"
  - "deduction-tracker"
  - "tax-projection-dashboard"
  - "estimated-tax-calculator"
  - "testing"

parallel_groups:
  # Phase 1: All reference data can be seeded in parallel
  - ["tax-reference-data"]
  # Phase 2: Federal and Wisconsin calculators can run in parallel
  - ["federal-tax-calculator", "wisconsin-tax-calculator"]
  # Phase 3: Deduction tracker and estimated tax both depend on federal calculator
  - ["deduction-tracker", "estimated-tax-calculator"]
  # Phase 4: Dashboard needs all calculators + deduction tracker
  - ["tax-projection-dashboard"]
  # Phase 5: Testing
  - ["testing"]

critical_path:
  - "tax-reference-data"
  - "federal-tax-calculator"
  - "wisconsin-tax-calculator"
  - "tax-projection-dashboard"
  - "testing"

estimated_phases: 8
total_tasks: 30
